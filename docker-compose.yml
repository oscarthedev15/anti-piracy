# Reference dev topology. The core pipeline is a single service today; the
# commented services show where the real system fans out. Bring up just the API:
#   docker compose up api
services:
  api:
    build: .
    command: uvicorn aegis.api.main:app --host 0.0.0.0 --port 8080 --reload
    ports:
      - "8080:8080"
    volumes:
      - ./:/app
    environment:
      - AEGIS_ENV=dev

